<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Bean & Brew</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #fcfbfa; color: #333; }
        header { background-color: #2c221e; color: #fff; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.5rem; }
        nav a { color: #d4a373; text-decoration: none; margin-left: 1.5rem; font-weight: 600; }
        nav a:hover { color: #fff; }
        .container { max-width: 600px; margin: 3rem auto; padding: 0 1.5rem; background: white; padding: 2.5rem; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { color: #2c221e; margin-top: 0; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #444; }
        input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { background-color: #2c221e; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #bc6c25; }
        .info { margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem; color: #666; font-size: 0.95rem; }
        footer { background-color: #2c221e; color: #888; text-align: center; padding: 1.5rem; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <h1>Bean & Brew</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/services">Services</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2>Get in Touch</h2>
        <form>
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="jane@example.com">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Drop us a note about catering, subscriptions, or feedback..."></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>

        <div class="info">
            <p><strong>Location:</strong> 142 Maple Street, Downtown</p>
            <p><strong>Hours:</strong> Mon–Fri: 6:30 AM – 6:00 PM | Sat–Sun: 7:30 AM – 5:00 PM</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Bean & Brew Coffee Co. All rights reserved.</p>
    </footer>
</body>
</html>
